x-taskforge-api-image: &taskforge-api-image
  image: taskforge-api:${TASKFORGE_IMAGE_TAG:-local}
  build:
    context: .
    target: api

x-taskforge-migration-image: &taskforge-migration-image
  image: taskforge-migration:${TASKFORGE_IMAGE_TAG:-local}
  build:
    context: .
    target: migration

x-taskforge-runtime-environment: &taskforge-runtime-environment
  TASKFORGE_ENVIRONMENT: production
  TASKFORGE_LOG_LEVEL: ${TASKFORGE_LOG_LEVEL:-INFO}
  TASKFORGE_TASK_CLAIM_RESULT_AUTHORITY_SECRET: ${TASKFORGE_TASK_CLAIM_RESULT_AUTHORITY_SECRET:?TASKFORGE_TASK_CLAIM_RESULT_AUTHORITY_SECRET is required}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-taskforge}
  POSTGRES_USER: ${POSTGRES_USER:-taskforge_runtime}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

x-taskforge-broker-environment: &taskforge-broker-environment
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_AMQP_PORT: "5672"
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-taskforge}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
  RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-taskforge}

x-taskforge-runtime-security: &taskforge-runtime-security
  user: "10001:10001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  stop_signal: SIGTERM
  restart: "on-failure:5"

services:
  postgres:
    image: postgres:18.4-bookworm@sha256:1961f96e6029a02c3812d7cb329a3b03a3ac2bb067058dec17b0f5596aca9296
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskforge}
      POSTGRES_USER: ${POSTGRES_OWNER_USER:-taskforge_owner}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?POSTGRES_OWNER_PASSWORD is required}
      TASKFORGE_RUNTIME_USER: ${POSTGRES_USER:-taskforge_runtime}
      TASKFORGE_RUNTIME_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TASKFORGE_MIGRATION_LOCK_TIMEOUT_SECONDS: ${TASKFORGE_MIGRATION_LOCK_TIMEOUT_SECONDS:-300}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init-taskforge-roles.sh:/docker-entrypoint-initdb.d/10-taskforge-roles.sh:ro
    networks:
      - database
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  migrate:
    <<: *taskforge-migration-image
    profiles:
      - operations
    command: ["python", "-m", "taskforge.database_migrations"]
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_signal: SIGTERM
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-taskforge}
      POSTGRES_OWNER_USER: ${POSTGRES_OWNER_USER:-taskforge_owner}
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?POSTGRES_OWNER_PASSWORD is required}
      TASKFORGE_MIGRATION_LOCK_TIMEOUT_SECONDS: ${TASKFORGE_MIGRATION_LOCK_TIMEOUT_SECONDS:-300}
    networks:
      - database
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.3.3-management@sha256:d8b3d416236ae5ba3f6a9f4e4651fdacda01780181a7d83a71b640248d8f0a69
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-taskforge}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-taskforge}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - broker
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          rabbitmq-diagnostics -q check_running &&
          rabbitmq-diagnostics -q check_port_connectivity &&
          rabbitmq-diagnostics -q check_local_alarms
      interval: 5s
      timeout: 15s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  api:
    <<: [*taskforge-api-image, *taskforge-runtime-security]
    command: ["python", "-m", "taskforge.api"]
    environment:
      <<: *taskforge-runtime-environment
      TASKFORGE_API_HOST: 0.0.0.0
      TASKFORGE_API_PORT: "8000"
      TASKFORGE_EXECUTION_STREAM_ALLOWED_ORIGINS: ${TASKFORGE_EXECUTION_STREAM_ALLOWED_ORIGINS:-[]}
      WEB_CONCURRENCY: "1"
    networks:
      - frontend
      - database
    ports:
      - "127.0.0.1:${TASKFORGE_API_PUBLISHED_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).close()
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  orchestrator:
    <<: [*taskforge-api-image, *taskforge-runtime-security]
    command: ["python", "-m", "taskforge.orchestrator"]
    environment:
      <<: [*taskforge-runtime-environment, *taskforge-broker-environment]
    networks:
      - database
      - broker
      - application-egress
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    <<: *taskforge-runtime-security
    image: taskforge-worker:${TASKFORGE_IMAGE_TAG:-local}
    build:
      context: .
      target: worker
    command: ["python", "-m", "taskforge.worker"]
    environment:
      <<: [*taskforge-runtime-environment, *taskforge-broker-environment]
      TASKFORGE_WORKER_CREDENTIAL: ${TASKFORGE_WORKER_CREDENTIAL-}
      TASKFORGE_WORKER_PROFILE: ${TASKFORGE_WORKER_PROFILE:-pipeline}
    networks:
      - database
      - broker
      - application-egress
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

networks:
  frontend:
    driver: bridge
  database:
    driver: bridge
    internal: true
  broker:
    driver: bridge
    internal: true
  application-egress:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:

# Resource limits are intentionally deployment-specific. Measure the database
# working set and connection budget, RabbitMQ queue depth/alarms, and each worker
# profile before applying CPU or memory limits in a private Compose override.
