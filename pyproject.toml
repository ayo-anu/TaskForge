[build-system]
requires = [
    "hatchling==1.32.0",
    "editables==0.5",
]
build-backend = "hatchling.build"

[project]
name = "taskforge"
version = "0.1.0"
description = "Distributed workflow and job orchestration engine"
requires-python = ">=3.12,<4"
dependencies = [
    "aio-pika>=9,<10",
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "opentelemetry-api>=1,<2",
    "opentelemetry-exporter-otlp-proto-http>=1,<2",
    "opentelemetry-sdk>=1,<2",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "sqlalchemy>=2,<3",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "alembic>=1,<2",
    "editables==0.5",
    "hatchling==1.32.0",
    "httpx2[ws]>=2,<3",
    "mypy>=1,<2",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]
security = [
    "pip-audit==2.10.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/taskforge"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires explicitly enabled external infrastructure",
    "workload: opt-in bounded workload against real external infrastructure",
    "contention: opt-in deterministic real-PostgreSQL contention scenario",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
pretty = true
show_error_codes = true
show_column_numbers = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["taskforge"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
precision = 2
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
