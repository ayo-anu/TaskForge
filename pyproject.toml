[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[project]
name = "taskforge"
version = "0.1.0"
description = "Distributed workflow and job orchestration engine"
requires-python = ">=3.12,<4"
dependencies = [
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/taskforge"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
pythonpath = ["src"]
testpaths = ["tests"]
