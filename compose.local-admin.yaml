services:
  postgres:
    networks:
      - postgres-local-admin
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  rabbitmq:
    networks:
      - rabbitmq-local-admin
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"

networks:
  postgres-local-admin:
    driver: bridge
  rabbitmq-local-admin:
    driver: bridge
